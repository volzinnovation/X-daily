name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run import smoke check
        run: |
          python - <<'PY'
          from src.database.storage import DataStorage as LegacyDataStorage
          from src.operations.storage import DataStorage
          import main

          assert LegacyDataStorage is DataStorage
          assert callable(main.main)
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Run extension archive checks
        run: |
          node --check extension/archive.js
          node --check extension/popup.js
          node tests/archive.test.cjs
