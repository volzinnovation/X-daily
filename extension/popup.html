<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X-Daily</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>X-Daily</h1>
      <p class="subtitle">Your daily summary of posts from accounts you follow</p>
    </header>
    
    <div id="status" class="status"></div>
    
    <div class="controls">
      <button id="generateBtn" class="btn btn-primary">Generate Daily Summary</button>
      <button id="demoBtn" class="btn btn-secondary">Preview Demo</button>
      <button id="archiveBtn" class="btn btn-secondary">Digest Archive</button>
      <button id="settingsBtn" class="btn btn-secondary">Settings</button>
    </div>
    
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Generating your daily summary...</p>
    </div>
    
    <div id="results" class="results hidden">
      <div class="stats">
        <span id="postCount">0</span> posts from <span id="accountCount">0</span> accounts
      </div>

      <div id="briefingPanel" class="briefing-panel"></div>
      
      <div id="newsletter" class="newsletter"></div>
      
      <div class="actions">
        <button id="saveArchiveBtn" class="btn btn-primary">Save Digest</button>
        <button id="downloadBtn" class="btn btn-secondary">Download HTML</button>
        <button id="emailBtn" class="btn btn-secondary">Send via Email</button>
      </div>
    </div>

    <div id="archive" class="archive hidden">
      <div class="section-header">
        <div>
          <h2>Digest Archive</h2>
          <p><span id="archiveCount">0</span> saved digests</p>
        </div>
        <button id="exportArchiveBtn" class="btn btn-secondary">Export</button>
      </div>
      <input type="search" id="archiveSearch" class="search-input" placeholder="Search topics, handles, keywords" />
      <div id="archiveList" class="archive-list"></div>
      <p id="archiveEmpty" class="empty-state">No saved digests yet. Generate or preview a digest, then save it here.</p>
      <button id="clearArchiveBtn" class="btn btn-quiet">Clear Archive</button>
    </div>
    
    <div id="settings" class="settings hidden">
      <h2>Settings</h2>
      <div class="setting-item">
        <label>
          X (Twitter) handle:
          <input type="text" id="xHandle" placeholder="yourusername" />
          <small>Enter your X username (without @)</small>
        </label>
      </div>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="autoGenerate" />
          Auto-generate daily summary
        </label>
      </div>
      <div class="setting-item">
        <label>
          Email address:
          <input type="email" id="emailAddress" placeholder="your@email.com" />
        </label>
      </div>
      <div class="setting-item">
        <label>
          Number of clusters:
          <input type="number" id="numClusters" value="5" min="2" max="10" />
        </label>
      </div>
      <button id="saveSettingsBtn" class="btn btn-primary">Save Settings</button>
    </div>
  </div>
  
  <script src="utils.js"></script>
  <script src="processor.js"></script>
  <script src="clustering.js"></script>
  <script src="newsletter.js"></script>
  <script src="archive.js"></script>
  <script src="demo-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
